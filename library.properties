sentence=Smooth non-blocking servo: moveTo(angle, time, easing), speed, limits, reverse, groups and sweep. One API for Arduino AVR, ESP8266 and ESP32 without extra libraries.
paragraph=Moves hobby servos smoothly without delay(): servo.moveTo(120, 1500, AlashServo::SMOOTH) goes there in 1.5 seconds while the program keeps running. Speed in degrees per second, soft limits to protect the mechanics, reverse and trim, easing curves (smooth, quadratic, bounce), sweep for radars and robot heads, AlashServoGroup to move a robot arm so that all joints arrive together, automatic release of the signal to stop buzzing. On ESP32 it drives the LEDC hardware PWM itself, no ESP32Servo needed; on AVR and ESP8266 it uses the built-in Servo library. Explains problems in Russian, Kazakh or English. Examples included, made for classes and kits by Alash Electronics.
